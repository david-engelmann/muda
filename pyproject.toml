[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secondbill"
version = "0.1.0"
description = "The git side statement of rework, billed to its causes"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
secondbill = "secondbill.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
