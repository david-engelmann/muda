<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 490" width="1040" height="490" role="img" aria-label="muda technical architecture">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1E293B" opacity="0.65"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#FB923C"/>
    </marker>
  </defs>
  <rect width="1040" height="490" rx="14" fill="#0B0F17" stroke="#1E293B" stroke-width="2"/>
  <rect width="1040" height="490" rx="14" fill="url(#grid)"/>
  <text x="28" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" fill="#F8FAFC">muda  //  TECHNICAL ARCHITECTURE &amp; INVARIANT BOUNDARIES</text>
  <text x="28" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#94A3B8">Reads reachable Git history for a UTC calendar month and emits an itemized minor-unit statement.</text>
  <line x1="28" y1="72" x2="1012" y2="72" stroke="#1E293B" stroke-width="1.2"/>
  <rect x="28" y="94" width="225" height="176" rx="10" fill="#111827" stroke="#334155" stroke-width="1.8"/>
  <text x="42" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="700" fill="#F8FAFC">1. Scrubbed Git DAG Read</text>
  <text x="42" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">git log from checked-out HEAD</text>
  <text x="42" y="155" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">Scrubs 8 GIT_* redirect vars</text>
  <text x="42" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">+ GIT_GRAFT_FILE=/dev/null</text>
  <text x="42" y="189" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">+ --no-replace-objects</text>
  <text x="42" y="206" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">+ --no-optional-locks</text>
  <text x="42" y="223" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">Window [from, to) in UTC</text>
  <rect x="289" y="94" width="425" height="176" rx="10" fill="#2C1206" stroke="#FB923C" stroke-width="1.8"/>
  <text x="303" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="700" fill="#FB923C">2. Three Rework Classes &amp; Cause Joins</text>
  <text x="303" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">REVERT      : joins across full DAG by Revert quoted subject</text>
  <text x="303" y="155" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">              or &#x27;This reverts commit &lt;sha&gt;&#x27; trailer</text>
  <text x="303" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">FIX-FORWARD : joins across full DAG by &#x27;Fixes: &lt;sha&gt;&#x27; trailer</text>
  <text x="303" y="189" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">REDONE TASK : joins earlier commits INSIDE stated month by</text>
  <text x="303" y="206" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">              exact subject + overlapping touched file paths</text>
  <text x="303" y="223" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">Unresolvable items land in unjoined[] with explicit reason</text>
  <rect x="750" y="94" width="262" height="176" rx="10" fill="#111827" stroke="#FB923C" stroke-width="1.8"/>
  <text x="764" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="700" fill="#F8FAFC">3. Minor-Unit Statement</text>
  <text x="764" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">Itemized causes[] -&gt; items[]</text>
  <text x="764" y="155" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">totals.per_class &amp; per_cause</text>
  <text x="764" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">Optional --rates rates.json:</text>
  <text x="764" y="189" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">  3-letter ASCII currency</text>
  <text x="764" y="206" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">  1..30 int + 0..2 frac digits</text>
  <text x="764" y="223" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">  Exact integer minor units</text>
  <line x1="253" y1="182" x2="287" y2="182" stroke="#FB923C" stroke-width="2.2" marker-end="url(#arr)"/>
  <line x1="714" y1="182" x2="748" y2="182" stroke="#FB923C" stroke-width="2.2" marker-end="url(#arr)"/>
  <rect x="28" y="300" width="480" height="158" rx="10" fill="#111827" stroke="#334155" stroke-width="1.8"/>
  <text x="42" y="324" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="700" fill="#F8FAFC">Accounting Honesty Invariants</text>
  <text x="42" y="344" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">- Unjoined items are NEVER silently billed and NEVER dropped</text>
  <text x="42" y="361" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">- Pricing charges joined items only; counts &amp; currency sit side-by-side</text>
  <text x="42" y="378" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">- Shallow clones refused by name (&#x27;statement needs the whole history&#x27;)</text>
  <text x="42" y="395" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">- Catchledger prices checks; muda prices reworked commits</text>
  <rect x="532" y="300" width="480" height="158" rx="10" fill="#111827" stroke="#334155" stroke-width="1.8"/>
  <text x="546" y="324" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="700" fill="#F8FAFC">Repository Isolation &amp; Atomic Output</text>
  <text x="546" y="344" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">- Write guard refuses any -o path resolving inside target git repo</text>
  <text x="546" y="361" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">- Sibling tempfile drawn from OS CSPRNG + atomic rename into place</text>
  <text x="546" y="378" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">- Validated against schema/rates.schema.json &amp; statement.schema.json</text>
  <text x="546" y="395" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">- Zero crate dependencies; runs on Linux, macOS, and Windows</text>
</svg>
