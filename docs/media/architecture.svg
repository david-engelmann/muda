<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 480" width="1040" height="480" role="img" aria-label="muda technical architecture">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#FB923C"/>
    </marker>
    <marker id="arrMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="1040" height="480" rx="14" fill="#0B0F17" stroke="#1E293B" stroke-width="2"/>
  <text x="28" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" fill="#F8FAFC">muda  //  TECHNICAL ARCHITECTURE &amp; INVARIANT BOUNDARIES</text>
  <text x="28" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#94A3B8">Reads reachable Git history for a UTC calendar month and emits an itemized minor-unit statement.</text>
  <line x1="28" y1="72" x2="1012" y2="72" stroke="#1E293B" stroke-width="1.2"/>
  <rect x="28" y="96" width="225" height="170" rx="10" fill="#111827" stroke="#334155" stroke-width="1.8"/>
  <text x="42" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="700" fill="#F8FAFC">1. Reachable Git DAG Read</text>
  <text x="42" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">git log from checked-out HEAD</text>
  <text x="42" y="157" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">Full history read for causes;</text>
  <text x="42" y="174" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">billing window [from, to) in</text>
  <text x="42" y="191" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">UTC author timestamps</text>
  <text x="42" y="208" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">GIT_CEILING_DIRECTORIES guard</text>
  <text x="42" y="225" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">Zero network / local git only</text>
  <rect x="289" y="96" width="425" height="170" rx="10" fill="#2C1206" stroke="#FB923C" stroke-width="1.8"/>
  <text x="303" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="700" fill="#FB923C">2. Three Rework Classes &amp; Cause Joins</text>
  <text x="303" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">REVERT      : joins across full DAG by Revert quoted subject</text>
  <text x="303" y="157" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">              or &#x27;This reverts commit &lt;sha&gt;&#x27; trailer</text>
  <text x="303" y="174" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">FIX-FORWARD : joins across full DAG by &#x27;Fixes: &lt;sha&gt;&#x27; trailer</text>
  <text x="303" y="191" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">REDONE TASK : joins within stated month by matching normalized</text>
  <text x="303" y="208" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">              subject + overlapping touched file paths</text>
  <text x="303" y="225" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">Unresolvable items land in unjoined[] with explicit reason</text>
  <rect x="750" y="96" width="262" height="170" rx="10" fill="#111827" stroke="#FB923C" stroke-width="1.8"/>
  <text x="764" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="700" fill="#F8FAFC">3. Minor-Unit Statement</text>
  <text x="764" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">Itemized causes[] -&gt; items[]</text>
  <text x="764" y="157" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">totals.per_class &amp; per_cause</text>
  <text x="764" y="174" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">Optional --rates rates.json:</text>
  <text x="764" y="191" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">  3-letter ISO currency</text>
  <text x="764" y="208" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">  Exact integer minor units</text>
  <text x="764" y="225" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">  (zero float rounding)</text>
  <line x1="253" y1="180" x2="287" y2="180" stroke="#FB923C" stroke-width="2.2" marker-end="url(#arr)"/>
  <line x1="714" y1="180" x2="748" y2="180" stroke="#FB923C" stroke-width="2.2" marker-end="url(#arr)"/>
  <rect x="28" y="298" width="480" height="148" rx="10" fill="#111827" stroke="#334155" stroke-width="1.8"/>
  <text x="42" y="322" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="700" fill="#F8FAFC">Accounting Honesty Invariants</text>
  <text x="42" y="342" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">- Unjoined items are NEVER silently billed and NEVER dropped</text>
  <text x="42" y="359" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">- Pricing charges joined items only; counts &amp; currency sit side-by-side</text>
  <text x="42" y="376" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">- Shallow clones warn/note history horizon; full fetch-depth=0 recommended</text>
  <text x="42" y="393" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">- Catchledger prices checks; muda prices reworked engineering output</text>
  <rect x="532" y="298" width="480" height="148" rx="10" fill="#111827" stroke="#334155" stroke-width="1.8"/>
  <text x="546" y="322" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="700" fill="#F8FAFC">Repository Isolation &amp; Atomic Output</text>
  <text x="546" y="342" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">- Write guard refuses any -o path resolving inside target git repo</text>
  <text x="546" y="359" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">- Sibling tempfile drawn from OS CSPRNG + atomic rename into place</text>
  <text x="546" y="376" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">- Validated against schema/rates.schema.json &amp; statement.schema.json</text>
  <text x="546" y="393" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">- Runs identically across Linux, macOS, and native Windows</text>
</svg>
