  <text x="106" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#94A3B8">muda  --  verified CLI capture  (32 / 100 rounds)</text>
  <rect x="24" y="68" width="912" height="25" rx="5" fill="#152036"/>
  <text x="34" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.2" font-weight="600" fill="#F8FAFC">$ muda statement --month 2026-01 --rates examples/rates.json ./service-repo</text>
  <text x="34" y="115" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.2" font-weight="600" fill="#FB923C">{ &quot;month&quot;: &quot;2026-01&quot;, &quot;window&quot;: { &quot;from&quot;: &quot;2026-01-01&quot;, &quot;to&quot;: &quot;2026-02-01&quot; }, &quot;commits_read&quot;: 6,</text>
  <text x="34" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.2" fill="#E2E8F0">  &quot;causes&quot;: [</text>
  <text x="34" y="177" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.2" fill="#F87171">    { &quot;cause&quot;: &quot;6b103c2866...&quot;, &quot;items&quot;: [{ &quot;class&quot;: &quot;revert&quot;,      &quot;join&quot;: &quot;revert subject&quot; }] },</text>
  <text x="34" y="208" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.2" fill="#FBBF24">    { &quot;cause&quot;: &quot;8aecd5aba2...&quot;, &quot;items&quot;: [{ &quot;class&quot;: &quot;fix-forward&quot;, &quot;join&quot;: &quot;Fixes trailer&quot;  }] },</text>
  <text x="34" y="239" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.2" fill="#38BDF8">    { &quot;cause&quot;: &quot;a9d4e12b...&quot;,   &quot;items&quot;: [{ &quot;class&quot;: &quot;redone&quot;,      &quot;join&quot;: &quot;redone task&quot;    }] }</text>
  <text x="34" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.2" fill="#E2E8F0">  ], &quot;unjoined&quot;: [],</text>
  <text x="34" y="301" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.2" font-weight="600" fill="#34D399">  &quot;totals&quot;: { &quot;items&quot;: 3, &quot;per_class&quot;: { &quot;revert&quot;: 1, &quot;fix-forward&quot;: 1, &quot;redone&quot;: 1 }, &quot;unjoined&quot;: 0 },</text>
  <text x="34" y="332" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.2" font-weight="600" fill="#FB923C">  &quot;priced&quot;: { &quot;currency&quot;: &quot;USD&quot;, &quot;items_priced&quot;: 3, &quot;total&quot;: &quot;26.50&quot; } }</text>
  <rect x="24" y="347" width="912" height="25" rx="5" fill="#152036"/>
  <text x="34" y="363" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.2" font-weight="600" fill="#F8FAFC">$ muda statement --month 2026-01 -o ./service-repo/bill.json ./service-repo</text>
  <text x="34" y="394" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.2" fill="#F87171">error, muda writes nothing inside the repository it reads   [exit 1]</text>
